# OpenSSH agent socket (systemctl --user enable --now ssh-agent.socket), for every
# process in the session: terminals, herdr, GUI apps and the AI agents they start.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

# Passphrase prompt (gum in a floating terminal, themed; see ssh-askpass-gum) for programs without a terminal,
# e.g. AI agents' git commands. In a terminal, ssh keeps asking in the terminal.
# If an agent tool ever hangs on git/ssh, add: SSH_ASKPASS_REQUIRE=prefer
SSH_ASKPASS=${HOME}/.local/bin/ssh-askpass-gum
