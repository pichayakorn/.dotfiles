# Personal tmux overrides on top of Omarchy's tmux.conf

# Prefix: C-t (replaces Omarchy's C-Space / C-b)
unbind C-Space
unbind C-b
set -g prefix C-t
set -g prefix2 None
bind -N "Send prefix" C-t send-prefix
set -g repeat-time 0

# Reload settings (Omarchy's `q` still works too)
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind -N "Open current directory" o run-shell "xdg-open '#{pane_current_path}' >/dev/null 2>&1 &"
bind -N "Kill all other panes" -r e kill-pane -a

# vim-like pane switching (overrides Omarchy's h = split, k = kill window)
bind -N "Focus pane up" -r k select-pane -U
bind -N "Focus pane down" -r j select-pane -D
bind -N "Focus pane left" -r h select-pane -L
bind -N "Focus pane right" -r l select-pane -R

# Moving window
bind -N "Move window left" -n C-S-Left swap-window -t -1 \; previous-window
bind -N "Move window right" -n C-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind -N "Resize pane up" -r C-k resize-pane -U 5
bind -N "Resize pane down" -r C-j resize-pane -D 5
bind -N "Resize pane left" -r C-h resize-pane -L 5
bind -N "Resize pane right" -r C-l resize-pane -R 5

# Split with current path
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"

# Display lazygit
bind -N "Lazygit popup" -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
